name: Desktop preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-baseline:
    name: Qt 6.5 compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install baseline Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: qtmultimedia
          cache: true
      - name: Configure full application with baseline Qt
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTRINGS_BUILD_GUI=ON
      - name: Build baseline application and tests
        run: cmake --build build --parallel 2
      - name: Run baseline tests
        run: ctest --test-dir build --output-on-failure
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            qt_arch: win64_msvc2022_64
          - os: macos-15
            platform: macos-arm64
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DSTRINGS_BUILD_GUI=ON
      - name: Configure macOS Apple Silicon
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DSTRINGS_BUILD_GUI=ON
      - name: Build full application
        run: cmake --build build --config Release --parallel
      - name: Test pitch engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload rendered GUI previews
        uses: actions/upload-artifact@v4
        with:
          name: GUI-${{ matrix.platform }}-${{ github.run_number }}
          path: build/gui-previews/*.png
          if-no-files-found: error
      - name: Install application and runtime dependencies
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"
      - name: Check macOS architecture and microphone description
        if: runner.os == 'macOS'
        run: |
          lipo stage/StringScaleTuner.app/Contents/MacOS/StringScaleTuner -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' stage/StringScaleTuner.app/Contents/Info.plist
          test -d stage/StringScaleTuner.app/Contents/Frameworks
      - name: Check Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @('stage/bin/StringScaleTuner.exe', 'stage/bin/Qt6Core.dll', 'stage/bin/msvcp140.dll', 'stage/bin/vcruntime140.dll', 'stage/bin/Qt6Multimedia.dll', 'stage/plugins/platforms/qwindows.dll') | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing runtime file: $_" }
          }
      - name: Verify Windows redistributable provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $optionalGraphics = Get-ChildItem stage -Recurse -File -Include opengl32sw.dll,D3Dcompiler_47.dll
          if ($optionalGraphics) { throw "Unexpected graphics redistributable: $($optionalGraphics.Name)" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ toolchain not found' }
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT/*.dll" -File
          $shipped = Get-ChildItem stage/bin -File -Include *.dll -Recurse |
            Where-Object Name -Match '^(msvcp|vcruntime|concrt)'
          foreach ($dll in $shipped) {
            $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
            $match = $redist | Where-Object {
              $_.Name -eq $dll.Name -and (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $hash
            } | Select-Object -First 1
            if (!$match) { throw "$($dll.Name) did not match a Visual Studio x64 redistributable" }
            Write-Host "$($dll.Name) $hash matches $($match.FullName)"
          }
      - name: Test user installer payload policy
        run: python -m unittest discover -s tests -p "*_test.py"
      - name: Package identifiable test build
        id: package
        shell: pwsh
        run: python scripts/package_preview.py --stage stage --build-info build/build-info.json --platform ${{ matrix.platform }} --output dist --qt-root "$env:QT_ROOT_DIR"
      - name: Verify finished ZIP and file inventory
        shell: pwsh
        run: python scripts/verify_preview.py --archive "${{ steps.package.outputs.archive_path }}" --expected-info build/build-info.json --platform ${{ matrix.platform }}
      - name: Build native test installer
        id: installer
        shell: pwsh
        run: python scripts/build_installer.py --stage stage --archive "${{ steps.package.outputs.archive_path }}" --build-info build/build-info.json --platform ${{ matrix.platform }} --output dist
      - name: Install and test Windows setup, then uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'StringScaleTuner-install-smoke'
          $setup = Start-Process -FilePath '${{ steps.installer.outputs.installer_path }}' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installPath`"") -PassThru
          if (!$setup.WaitForExit(60000)) { $setup.Kill(); throw 'Setup timed out' }
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          python scripts/smoke_installer.py --root "$installPath" --platform windows-x64 --expected-info build/build-info.json --payload-inventory "${{ steps.installer.outputs.installer_inventory }}" --preview-out "$env:RUNNER_TEMP/installer-previews"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
          $uninstall = Start-Process -FilePath "$installPath/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru
          if (!$uninstall.WaitForExit(60000)) { $uninstall.Kill(); throw 'Uninstall timed out' }
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path "$installPath/bin/StringScaleTuner.exe"); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path "$installPath/bin/StringScaleTuner.exe") { throw 'Uninstall left the application executable behind' }
      - name: Install and test macOS package on hosted runner
        if: runner.os == 'macOS'
        run: |
          # This install runs only on the disposable GitHub-hosted VM.
          sudo /usr/sbin/installer -pkg "${{ steps.installer.outputs.installer_path }}" -target /
          python3 scripts/smoke_installer.py --root /Applications --platform macos-arm64 --expected-info build/build-info.json --payload-inventory "${{ steps.installer.outputs.installer_inventory }}" --preview-out "$RUNNER_TEMP/installer-previews"
      - name: Upload installer audit data separately
        uses: actions/upload-artifact@v4
        with:
          name: Installer-audit-${{ matrix.platform }}-${{ github.run_number }}
          path: ${{ steps.installer.outputs.installer_inventory }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload native test installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}-installer
          path: |
            ${{ steps.installer.outputs.installer_path }}
            ${{ steps.installer.outputs.installer_checksum }}
            ${{ steps.installer.outputs.installer_manifest }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}-developer
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
